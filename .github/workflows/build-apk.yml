name: Build APK

on:
  push:
    branches: [main, master]
    paths-ignore: ["server/**", "**.md", "render.yaml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Установка зависимостей
        run: npm install --no-audit --no-fund

      - name: Создание Android-проекта
        run: npx cap add android

      - name: Разрешения, иконка, адрес сервера
        run: node scripts/patch-android.mjs
        env:
          SERVER_URL: ${{ vars.SERVER_URL }}

      - name: Копирование приложения в Android-проект
        run: npx cap sync android

      - name: Сборка APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Scan3D.apk"

      - name: APK как артефакт сборки
        uses: actions/upload-artifact@v4
        with:
          name: Scan3D-apk
          path: Scan3D.apk

      - name: APK в раздел Releases (удобно скачать с телефона)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Scan3D сборка ${{ github.run_number }}
          body: "Установите Scan3D.apk на телефон. Перед установкой разрешите установку из неизвестных источников."
          files: Scan3D.apk
          make_latest: true
