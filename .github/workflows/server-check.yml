name: Server check

on:
  push:
    branches: [main, master]
    paths: ["server/**", ".github/workflows/server-check.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Зависимости
        run: pip install -r server/requirements.txt

      - name: Тест пайплайна (поддельный COLMAP)
        working-directory: server
        run: python tests/pipeline_test.py

      - name: Тест HTTP API
        working-directory: server
        run: python tests/api_test.py

      - name: Сборка Docker-образа (как на Render)
        run: docker build -t scan3d-server server

      - name: Полный тест с настоящим COLMAP внутри образа
        run: docker run --rm -e COLMAP_THREADS=2 -v "$PWD/server/tests:/srv/tests" scan3d-server python tests/colmap_e2e.py
